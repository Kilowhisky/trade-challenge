[project]
name = "tc"
version = "0.1.0"
description = "trade-challenge v3 engine"
requires-python = ">=3.12"
dependencies = [
  "schwab-py==1.5.1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.3,<3",
  "PyYAML>=6.0",
  "aiosqlite>=0.20",
  "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
  "pytest>=8", "pytest-asyncio>=0.23", "hypothesis>=6.100",
  "mypy>=1.10", "ruff>=0.5", "types-PyYAML",
]

[project.scripts]
tc = "tc.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tc*"]

[tool.setuptools.package-data]
tc = ["store/schema.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S", "RUF"]
ignore = ["S101"]  # asserts in tests

[tool.ruff.lint.per-file-ignores]
# tc/rules/model.py: the compact one-line @property table (16 accessors) is
# deliberate; some exceed the line-length limit. Scoped here rather than a
# global ignore so line length still enforces everywhere else.
"tc/rules/model.py" = ["E501"]
# Tests: wide fixture literals and keyword-heavy model constructions read
# better on one line than wrapped. Only E501 is relaxed — every real lint
# (unused imports, shadowing, async hazards, hard-coded temp paths) still
# applies to the test suite exactly as it does to tc/.
"../tests/engine/**/*.py" = ["E501"]

[tool.mypy]
strict = true
# The tests are checked too: they are the only executable statement of what
# the engine promises, and an untyped test can assert a shape that mypy would
# have rejected in tc/.
files = ["tc", "../tests/engine"]
# BaseSettings fields are populated from the environment, so mypy must not
# demand them as __init__ arguments; the plugin knows that and also types
# _env_file, which is why no call-arg ignore is needed at the call site.
plugins = ["pydantic.mypy"]
python_version = "3.12"
ignore_missing_imports = true  # schwab-py ships no stubs

[tool.pytest.ini_options]
testpaths = ["../tests/engine"]
asyncio_mode = "auto"
