# Trade-challenge server topology.
#
# Paths are relative to this file, so the repo root is `..`. Run everything from
# the docker/ directory (or with `-f docker/docker-compose.yml`).
#
# READ THIS BEFORE CHANGING ENV VARS ON `broker`:
# schwab-mcp sets allow_write from three cases (cli.py:300-341) —
#   1. no Discord config, no flag  -> allow_write=False
#   2. Discord token+channel+approver -> allow_write=True, ✅/❌ gated
#   3. --jesus-take-the-wheel      -> allow_write=True, NoOpApprovalManager
#
# MEASURED, not assumed: allow_write=False registers 23 tools, allow_write=True
# registers 25. The two it adds are exactly `place_previewed_order` and
# `cancel_order`. The seven `preview_*_order` tools are present EITHER WAY — a
# preview is a real Schwab API call but changes nothing, and cannot become an
# order without place_previewed_order.
#
# **This broker runs in state 2 as of 2026-08-25.** Phases 1-3 ran in state 1,
# which was correct while the Mac held its own token and placed every order.
# That stopped being true the moment Schwab's one-refresh-token-per-app rule
# made the two installs mutually exclusive: with the laptop pointed at this
# broker, state 1 meant NO order could be placed from anywhere, including a
# close. A book that can be entered but not exited is not the safer state.
#
# What is NOT weakened: every write still blocks on Chris's ✅/❌ in Discord
# `#llm-yolo` (state 2, not state 3), exactly as the manual's "Verified account
# facts" describes. This needed no §9 amendment — the 2026-08-24 amendment to
# §0 already authorises unattended operation *with the gate intact* ("Unattended
# is not unapproved. Every order still passes the Discord approval gate").
#
# What now carries the weight the old state-1 broker used to: the scheduled
# jobs' own tool allowlist. `scheduled-run.sh` passes read-only Schwab tools and
# nothing else, and `test-scheduled-run.sh` fails if an order tool ever appears
# there. A scheduled research run therefore still has no route to an order —
# but that is now ONE guard, not two, and it is a script edit away rather than
# a container rebuild away. Treat that allowlist as load-bearing.
#
# State 3 must never be used here — scripts/check-consistency.sh fails if the
# flag appears anywhere in this repo. It is the one that removes the human.

name: trade-challenge

x-common: &common
  # A FULL reference, not a tag suffix. scripts/deploy.sh rolls back by pinning
  # the previous image by DIGEST, and `...:${IMAGE_TAG}` cannot express that —
  # it produced `...:sha256:0f8b…`, an invalid reference, so the rollback failed
  # while Discord reported success. Digest-pinning is also immune to a tag
  # being moved under it, which is exactly what you want when restoring a known
  # good image.
  image: ${TC_IMAGE:-ghcr.io/kilowhisky/trade-challenge:latest}
  build:
    context: ..
    dockerfile: docker/Dockerfile
  environment: &common-env
    TZ: America/New_York
    HOME: /home/trader
  restart: unless-stopped

services:

  # --- the broker: one token holder, one process, one re-auth point --------
  # Every scheduled run attaches over HTTP instead of spawning its own stdio
  # subprocess. N stdio brokers would race on one token.yaml, and each could
  # independently trigger a BLOCKING 5-minute login flow (auth.py easy_client ->
  # client_from_login_flow, callback_timeout=300.0) inside a job that has 30
  # seconds of patience.
  broker:
    <<: *common
    container_name: tc-broker
    # The entrypoint refuses to start schwab-mcp without a usable token. Measured
    # behaviour without it: easy_client falls through to an interactive login
    # flow that blocks 300s for a browser callback that cannot arrive, then
    # dies — a five-minute-per-iteration crash-loop under `restart:
    # unless-stopped`. The guard waits quietly instead and self-starts when a
    # fresh token appears.
    entrypoint: ["/app/docker/broker-entrypoint.sh"]
    command:
      - schwab-mcp
      - server
      - --http
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
    # Loopback-only on the host, so the laptop can reach the ONE live broker
    # over `ssh -L 8000:127.0.0.1:8000 brewmaster` without depending on the
    # container's bridge IP (which changes on recreate). Schwab issues one
    # refresh token per app: a second schwab-mcp on the laptop cannot hold a
    # live token alongside this one (2026-08-25). Never bind 0.0.0.0 here.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      <<: *common-env
      SCHWAB_CLIENT_ID: ${SCHWAB_CLIENT_ID:?set in docker/.env}
      SCHWAB_CLIENT_SECRET: ${SCHWAB_CLIENT_SECRET:?set in docker/.env}
      # These three are what schwab-mcp reads: discord_requested is
      # `any(token, channel, approvers)`, so their presence sets
      # allow_write=True and registers place_previewed_order + cancel_order
      # BEHIND the ✅/❌ approval gate. All three are set deliberately —
      # APPROVERS especially, because token+channel without an approver list
      # would gate on a reaction from anyone who can see the channel.
      # See the state-2 note in this file's header. scripts/test-broker-gating.sh
      # pins both halves: the tools appear, and the gate is a human one.
      SCHWAB_MCP_DISCORD_TOKEN: ${SCHWAB_MCP_DISCORD_TOKEN:?set in docker/.env}
      SCHWAB_MCP_DISCORD_CHANNEL_ID: ${SCHWAB_MCP_DISCORD_CHANNEL_ID:?set in docker/.env}
      SCHWAB_MCP_DISCORD_APPROVERS: ${SCHWAB_MCP_DISCORD_APPROVERS:?set in docker/.env}
      # broker-entrypoint.sh reports a re-auth stall through discord-notify.sh,
      # which prefers these names. Kept as the explicit alias rather than
      # relying on its SCHWAB_MCP_* fallback, so the entrypoint's Discord access
      # does not silently depend on the write gate staying enabled.
      TC_DISCORD_TOKEN: ${SCHWAB_MCP_DISCORD_TOKEN:?set in docker/.env}
      TC_DISCORD_CHANNEL_ID: ${SCHWAB_MCP_DISCORD_CHANNEL_ID:?set in docker/.env}
    volumes:
      - ..:/app:ro
      - schwab-token:/home/trader/.local/share/schwab-mcp
    # The target is a Raspberry Pi 4 with 3.7Gi RAM and 511Mi swap. Without
    # limits, one runaway headless claude run in the scheduler can push the box
    # into swap-death and take the broker with it — losing the token holder and
    # every job at once. The broker is a light Python process; this is generous.
    mem_limit: 512m
    # This box is SHARED, and not with trivia: pihole-FTL is DNS for the whole
    # network, and Home Assistant (~470MB, the largest single process here) runs
    # home automation. Measured baseline with both up: 762MB used of 3796MB, so
    # our 512m + 2g ceiling fits inside the ~3.0GB available with roughly 500MB
    # to spare, on top of 3.5GB of swap whose fast 1.5GB tier is zram.
    #
    # Under real pressure the kernel picks its own victim and the largest RSS is
    # not the one you can least afford to lose — it would reach for Home
    # Assistant first. A positive oom_score_adj makes our containers the
    # preferred casualty instead, so a bad research run costs a research run and
    # not the household's DNS or lights.
    oom_score_adj: 500
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # --- the scheduler: what actually fixes the reported bug -----------------
  scheduler:
    <<: *common
    container_name: tc-scheduler
    command: ["supercronic", "-passthrough-logs", "/app/docker/crontab"]
    environment:
      <<: *common-env
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?set in docker/.env}
      SCHWAB_MCP_DISCORD_TOKEN: ${SCHWAB_MCP_DISCORD_TOKEN:?set in docker/.env}
      SCHWAB_MCP_DISCORD_CHANNEL_ID: ${SCHWAB_MCP_DISCORD_CHANNEL_ID:?set in docker/.env}
      TC_BROKER_URL: http://broker:8000/mcp
    volumes:
      - ..:/app
      # The store is mounted at the SAME absolute path it has on the host, not
      # at a container-private path like /data. The repo's research/, status/
      # and trade-log.csv entries are symlinks whose targets are host-absolute
      # (bootstrap-server.sh writes them), and the container sees those
      # symlinks through the /app bind mount — so a store mounted anywhere
      # else leaves every one of them dangling inside the container, and the
      # first scheduled job dies at its first write. Found 2026-08-25, the
      # night before the first scheduled fire.
      - ${TC_DATA_DIR:-../../trade-challenge-store}:${TC_DATA_DIR:-/data}
      # The sidecar push runs INSIDE this container (scheduled-run.sh calls
      # sidecar-sync.sh), and the store's remote is the github-tcstore ssh
      # alias — defined in the host's ~/.ssh/config with a repo-scoped deploy
      # key. Read-only: the scheduler needs to USE the key, never to mint one.
      - ${TC_SSH_DIR:-~/.ssh}:/home/trader/.ssh:ro
      - claude-home:/home/trader/.claude
      # READ-ONLY, and only so token-watchdog.sh can read creation_timestamp.
      # The token lives in a docker VOLUME, not on the host filesystem, so a
      # watchdog running on the host finds nothing and fires "token missing"
      # every single day — an alarm that cries wolf daily is worse than none,
      # because it trains you to ignore the one day it is right. Mounting it
      # here lets the watchdog use the ordinary in-container path.
      # :ro matters — the scheduler must never be able to write the token.
      - schwab-token:/home/trader/.local/share/schwab-mcp:ro
    # supercronic itself is tiny, but it forks `claude` inside this container,
    # which is the memory-hungry part. 2g leaves ~1.2Gi for the host and broker.
    # An OOM here kills that one job with exit 137, which scheduled-run.sh
    # reports — far better than the kernel picking a victim at random.
    mem_limit: 2g
    # Higher than the broker's: if something has to die, kill the job, not the
    # token holder that every other job depends on.
    oom_score_adj: 800
    depends_on:
      broker:
        condition: service_healthy

  # --- interactive sessions: `docker compose run --rm -it claude` ----------
  claude:
    <<: *common
    container_name: tc-claude
    profiles: ["manual"]
    restart: "no"
    stdin_open: true
    tty: true
    mem_limit: 2g
    oom_score_adj: 800
    command: ["claude"]
    environment:
      <<: *common-env
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?set in docker/.env}
      SCHWAB_MCP_DISCORD_TOKEN: ${SCHWAB_MCP_DISCORD_TOKEN:?set in docker/.env}
      SCHWAB_MCP_DISCORD_CHANNEL_ID: ${SCHWAB_MCP_DISCORD_CHANNEL_ID:?set in docker/.env}
      TC_BROKER_URL: http://broker:8000/mcp
    volumes:
      - ..:/app
      # Same-path store mount + deploy key as the scheduler — see the comment
      # there. An interactive session writes status/ notes and pushes them too.
      - ${TC_DATA_DIR:-../../trade-challenge-store}:${TC_DATA_DIR:-/data}
      - ${TC_SSH_DIR:-~/.ssh}:/home/trader/.ssh:ro
      - claude-home:/home/trader/.claude
    depends_on:
      broker:
        condition: service_healthy

  # --- Schwab OAuth re-auth, ~weekly ---------------------------------------
  # network_mode: host is REQUIRED, not convenience. auth.py:106-112 hard-rejects
  # any callback hostname but 127.0.0.1, so the callback server binds the
  # container's loopback — which a published port cannot reach, because Docker's
  # proxy targets the container IP, not its loopback. With host networking the
  # container's 127.0.0.1:8182 IS the host's, so `ssh -L 8182:127.0.0.1:8182`
  # from your laptop reaches it. Runbook in README.md.
  schwab-auth:
    <<: *common
    container_name: tc-schwab-auth
    profiles: ["manual"]
    restart: "no"
    network_mode: host
    stdin_open: true
    tty: true
    command: ["schwab-mcp", "auth"]
    environment:
      <<: *common-env
      SCHWAB_CLIENT_ID: ${SCHWAB_CLIENT_ID:?set in docker/.env}
      SCHWAB_CLIENT_SECRET: ${SCHWAB_CLIENT_SECRET:?set in docker/.env}
    volumes:
      - schwab-token:/home/trader/.local/share/schwab-mcp

volumes:
  schwab-token:
  claude-home:
