# config.yml — non-secret engine configuration (spec §9). Secrets live in .env
# as TC_* variables and are never written here.
engine:
  timezone: America/New_York
  data_dir: /data
  repo_dir: /app/repo          # the checkout, read-only: rules.yml, .claude/, CLAUDE.md
  http_bind: 127.0.0.1:8080
  reserve_usd: "900.00"        # CLAUDE.md header: the one fixed dollar quantity
  orders_from: 2026-08-14      # the earliest date an order could still be resting — coverage, not a date (tick.md §B3)
  leveraged_symbols: []        # §3.5: leveraged/inverse ETF symbols the clocks watch; Plan 0c's universe table replaces this list
  research_dir: /data/research   # documents Claude reads whole (spec §6); ledgers are tables
runner:
  url: http://127.0.0.1:8090     # the runner container, host networking, loopback only
  connect_timeout_s: 10.0
  slack_s: 120.0                 # added to a job's timeout for the engine's HTTP read budget
token:
  reauth_after_days: 5         # engine posts the auth URL to Discord at this age
  hard_expiry_days: 7          # Schwab's absolute refresh-token lifetime (verified 2026-09-02)
  # Must equal the callback registered on the Schwab app EXACTLY. The engine
  # serves /oauth/callback behind `tailscale serve` on 8443 (443 is Pi-hole),
  # tailnet-only: the phone/laptop completing the login must be on the tailnet.
  # Chris (2026-09-07): use the ts.net name for now; the custom domain
  # (brewhouse.wetzelrice.com, Caddy) can replace it later.
  callback_url: https://brewmaster.tail14458e.ts.net:8443/oauth/callback
shadow:
  enabled: true                # Phase 0: shadow webhook only, no #llm-yolo, no orders
schedule:                      # ET. weekdays = trading days per get_market_hours
  tick:          "every 15m 09:32-15:47 weekdays"
  session_close: "at 16:04 weekdays"
  token_check:   "at 07:05 daily"
  expectations:  "at 07:30 daily"
  backup:        "at 23:30 daily"
  weekly_universe: "at 07:40 sat"   # the market is shut; the regular-session close is the screening price
  # Task 12 (jobs/spec.py): the six research-role jobs, unchanged from the v2
  # docker/crontab times (scout 07:12, catalyst 18:33, preopen 08:17,
  # postclose 16:22, sector_tag Sat 09:40). `research` keeps its "hourly at
  # :57" semantics as `every 60m 09:57-14:57 weekdays` — check-consistency.sh
  # greps research.md for that phrase and for "hours 9-14" directly.
  scout:      "at 07:12 weekdays"
  catalyst:   "at 18:33 weekdays"
  preopen:    "at 08:17 weekdays"
  postclose:  "at 16:22 weekdays"
  research:   "every 60m 09:57-14:57 weekdays"
  sector_tag: "at 09:40 sat"
expectations:                  # spec §7 layer 3 — declarative anomaly checks over the store
  - name: ticks_per_session_min
    check: ticks_per_session_min
    arg: 20                    # a normal RTH session sweeps every 15m from 09:32-15:47 -> ~25 ticks
  - name: session_status_present
    check: session_status_present
  - name: job_verdict_not
    check: job_verdict_not
    arg: content_failed
    window_sessions: 5
  - name: token_days_until_dead_min
    check: token_days_until_dead_min
    arg: 2
