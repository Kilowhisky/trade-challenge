# config.yml — non-secret engine configuration (spec §9). Secrets live in .env
# as TC_* variables and are never written here.
engine:
  timezone: America/New_York
  data_dir: /data
  repo_dir: /app/repo          # the checkout, read-only: rules.yml, .claude/, CLAUDE.md
  http_bind: 127.0.0.1:8080
  reserve_usd: "900.00"        # CLAUDE.md header: the one fixed dollar quantity
  orders_from: 2026-08-14      # the earliest date an order could still be resting — coverage, not a date (tick.md §B3)
  leveraged_symbols: []        # §3.5: leveraged/inverse ETF symbols the clocks watch; Plan 0c's universe table replaces this list
token:
  reauth_after_days: 5         # engine posts the auth URL to Discord at this age
  hard_expiry_days: 7          # Schwab's absolute refresh-token lifetime (verified 2026-09-02)
  # The callback registered on the ONE Schwab app (schwab-mcp's default). Schwab
  # matches it exactly; a browser cannot load it, which is fine: the operator
  # copies the redirected URL and runs `tc auth-complete '<url>'`. Move it to
  # https://brewmaster.<tailnet>.ts.net/oauth/callback once Tailscale is up and
  # the app's callback has been changed in the developer portal (re-approval).
  callback_url: https://127.0.0.1:8182
shadow:
  enabled: true                # Phase 0: shadow webhook only, no #llm-yolo, no orders
schedule:                      # ET. weekdays = trading days per get_market_hours
  tick:          "every 15m 09:32-15:47 weekdays"
  session_close: "at 16:04 weekdays"
  token_check:   "at 07:05 daily"
  expectations:  "at 07:30 daily"
  backup:        "at 23:30 daily"
expectations:                  # spec §7 layer 3 — declarative anomaly checks over the store
  - name: ticks_per_session_min
    check: ticks_per_session_min
    arg: 20                    # a normal RTH session sweeps every 15m from 09:32-15:47 -> ~25 ticks
  - name: session_status_present
    check: session_status_present
  - name: job_verdict_not
    check: job_verdict_not
    arg: content_failed
    window_sessions: 5
  - name: token_days_until_dead_min
    check: token_days_until_dead_min
    arg: 2
