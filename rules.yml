# rules.yml — the single source of truth for every rule PARAMETER.
#
# Why this file exists: on 2026-08-17 a §9 amendment raised the §3.2 option
# caps and updated the manual, but the same numbers also lived in the playbook
# (twice), a design spec, and scripts/pre-order-check.sh. Three of the four
# drifted, including the mandatory pre-order gate, and it went unnoticed for
# four days. Every parameter now lives here exactly once.
#
# CONTRACT
#   - `manual:` values are §9-gated. Changing one is an amendment to CLAUDE.md
#     and requires Chris's explicit conversation, his words quoted in the
#     commit, a flat book, and calm conditions. Change this file and CLAUDE.md
#     in the same commit, never one without the other.
#   - `strategy:` values are *(strategy rule)* — discretionary, stricter than
#     the manual by construction, changeable without §9.
#   - scripts/check-consistency.sh verifies that every number stated in the
#     docs matches this file, and that no strategy value is looser than the
#     manual value it tightens. Run it at session open and before any commit
#     that touches a rule.
#   - scripts/lib-rules.sh loads these into shell variables. Consumers read
#     them; nothing hard-codes a rule number ever again.
#
# FORMAT is deliberately two levels deep and flat within a section, so a
# dependency-free awk parser can read it. Do not add deeper nesting.

manual:
  # Capital (header). The only fixed dollar quantities in the system.
  settlement_reserve_usd: 900.00

  # §1.4 / §2 — instrument floors
  min_share_price_usd: 5.00
  # Liquidity is gated on DOLLAR volume, not share count. A share-count floor
  # is a proxy for "can we get filled" calibrated to account size; at a max
  # §3.1 position near $1,015 a $5M/day name absorbs us at ~0.02% of volume.
  # The share floor survives only as a sanity check on thin, high-priced names.
  min_avg_daily_dollar_volume: 5000000
  min_avg_daily_volume: 100000

  # §3.1 — single position cap, % of competition capital, after the fill
  single_position_pct: 35

  # §3.2 — option sizing, % of competition capital
  option_single_position_pct: 20
  option_open_premium_pct: 30
  # §3.2 — option quality floors, all must hold at entry
  # DERIVED, not chosen. Options carry no resting stop (§3.4 excludes them),
  # so an option can only be closed by a live session — and §3.3's auto-exercise
  # is the largest event risk in the account. The floor is therefore the §3.3
  # exit plus the longest plausible blackout plus room to actually trade:
  #   option_min_dte = option_close_at_dte + option_max_blind_days
  #                    + option_dte_execution_margin_days
  # check-consistency.sh enforces that identity, so changing any input without
  # changing the floor fails the build.
  option_min_dte: 18
  option_max_blind_days: 10          # 7-day token lapse + a long weekend
  option_dte_execution_margin_days: 3 # a close may need several sessions
  option_min_delta: 0.35
  option_min_open_interest: 500
  option_max_spread_pct_of_mid: 10

  # §3.3 — expiration handling
  option_close_at_dte: 5
  occ_auto_exercise_itm_usd: 0.01

  # §3.4 — stop-loss geometry. The trigger scales to the name's own daily ATR
  # rather than sitting fixed, so risk per trade is roughly constant instead
  # of varying with volatility. Floor and cap bound it: the cap limits
  # worst-case loss, the floor stops a quiet name getting a hair-trigger stop.
  stop_atr_multiple: 2.5
  stop_trigger_min_pct: 8
  stop_trigger_max_pct: 15
  stop_limit_pct_below_trigger: 5

  # §3.5 — leveraged / inverse ETFs
  leveraged_aggregate_pct: 20
  leveraged_max_hold_sessions: 5

  # §3.6 — drawdown circuit breaker. Halt is the ONLY level; the Caution band
  # was removed 2026-08-17 per §9. Do not add an intermediate multiple here.
  halt_multiple_of_hwm: 0.80

  # §3.8 — correlation
  correlation_cap_pct: 50
  correlation_threshold: 0.7

  # §4.10 — order-rate ceilings. Trip on the attempt to exceed (N+1).
  max_orders_per_symbol_per_session: 4
  max_replaces_per_stop_per_day: 3

  # §8 — window and endgame
  window_start: 2026-08-14
  window_end: 2026-09-14
  final_session: 2026-09-14
  lockout_start: 2026-09-10
  lockout_final_sessions: 3

strategy:
  # Stricter than the manual by construction. Each must stay on the tight side
  # of the manual value it references; check-consistency.sh enforces that.

  # Playbook §3 — sleeve ceilings, % of competition capital
  sleeve_core_pct: 50
  sleeve_catalyst_pct: 30
  sleeve_options_open_pct: 30
  sleeve_leveraged_pct: 20
  max_deployed_pct: 100

  # Playbook §4 — selection
  # Was "reject if 10% ÷ daily ATR% < 3", i.e. reject ATR% > 3.33 — a filter
  # that existed only because the stop was fixed at 10%. With an ATR-scaled
  # stop the binding constraint is the stop cap: reject a name only when
  # 2.5 x ATR% would exceed manual stop_trigger_max_pct.
  max_daily_atr_pct: 6
  # Replaces the fixed $20-60 band, set when the catalyst sleeve was $270 and
  # never rescaled. Expressed as granularity so it moves with capital: the
  # sleeve must buy at least this many whole shares.
  # Lowered 6 -> 3 on 2026-08-20 (Chris). At 6 the ceiling was sleeve/6 =
  # ~$145, which blocked TGT and HD on granularity while both remained
  # core-eligible -- a ceiling doing thesis work it was never meant to do.
  # Cost accepted: a 3-share position scales coarsely (partial exits move in
  # thirds), so the ratchet, not scaling, carries the risk management.
  catalyst_min_whole_shares: 3

  # Playbook §4 — takeover-stub rejection. A survivor whose latest session
  # high-low range is under this percentage of its price is pinned, not
  # quiet, and is rejected by /weekly-universe's --qualified-only pass.
  #
  # Why it exists: on 2026-08-19, nine of fifteen names on the shortlist were
  # announced all-cash deal targets trading pinned under their deal price.
  # A deal price is by construction the 52-week high, so the proximity tilt
  # that ranks this universe was acting as a merger detector. UTZ and DBRG
  # were promoted to WATCH on that artifact and had to be retracted.
  #
  # 0.75 is a VALIDATED number, not a chosen one: against the 118 survivors
  # of 2026-08-21 it removed 17 (14.4%) — 8 known stubs, 6 newly confirmed
  # and tombstoned (FBRX, VREX, SAFT, GBTG, PAYO, SLAB), 2 unconfirmed — and
  # zero live momentum names. Known escape: UTZ ranges 0.82% and survives.
  # The session_range_pct column exists so the next escape is visible in the
  # universe file rather than only in hindsight; retune on that evidence.
  min_session_range_pct: 0.75

  # Size of the weekly working universe handed to the daily tier. Chosen to
  # match what the daily run can deep-vet, not everything that qualifies;
  # universe-filter reports how many it dropped so this can be tuned on
  # evidence rather than guessed twice.
  working_universe_size: 500

  # Playbook §5 — exits
  stall_rule_consecutive_closes: 2
  stall_rule_from_session: 4
  ratchet_breakeven_at_gain_pct: 8
  ratchet_entry_plus8_at_gain_pct: 15

  # Playbook §6 — options, tighter than manual §3.2
  option_min_delta: 0.40               # manual floor is 0.35
  leveraged_exit_session: 4            # manual limit is 5

  # Playbook §8 — monitoring cadence, seconds
  tick_interval_naked_s: 60
  tick_interval_working_order_s: 300
  tick_interval_positions_s: 900

  # Playbook §10 — endgame calendar
  all_options_flat_by: 2026-09-04
  last_leveraged_entry: 2026-09-01
